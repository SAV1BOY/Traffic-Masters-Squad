# ============================================================
# TRAFFIC MASTERS SQUAD — config.yaml (Cerebro de Roteamento)
# ============================================================

squad:
  name: traffic-masters
  version: "1.0.0"
  description: "Paid Traffic + Customer Acquisition + Creative Strategy + Tracking + Scaling"
  chief_agent: traffic-chief
  total_agents: 16
  budget_target: "R$ 336K/mes"

principles:
  - data-first
  - test-before-scale
  - creative-is-targeting
  - track-everything
  - fix-the-funnel

# ============================================================
# ROUTING: Task → Agents → Frameworks → Checklists → Templates → Registry
# ============================================================

