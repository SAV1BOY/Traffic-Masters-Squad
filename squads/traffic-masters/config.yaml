    checklists: [mandalia/mandalia-5w-avatar-depth-audit, kusmich/kusmich-targeting-trifecta-3fs]
    templates: [briefs/acquisition-strategy-brief]
    registry: [data/research/avatar-and-icp]

  competitor-ads-swipe-mining:
    agents: [creative-analyst, ads-analyst]
    frameworks: [creative-angle-matrix, hook-library-system]
    checklists: [creative/angle-coverage-quality]
    templates: [reports/competitor-ads-analysis-report]
    registry: [data/research/competitor-ads]

  keyword-research-google:
    agents: [kasim-aslam, ads-analyst]
    frameworks: [aslam-4-core-campaign-types]
    checklists: [aslam/aslam-search-query-hygiene]
    templates: []
    registry: [data/research/keyword-research]

  offer-research:
