# ============================================================
# CROSS-SQUAD INTEGRATION
# ============================================================

cross_squad:
  copy_squad:
    handoff_to_traffic:
      - "ad copy (headlines, primary text, CTAs) → templates/ads/"
      - "VSL scripts → templates/ads/youtube-ad-script-aducate"
      - "landing page copy → tasks/setup/"
    handoff_from_traffic:
      - "creative performance data → copy/data/"
      - "audience insights → copy/reference/"
      - "winning hooks → copy/swipe/"
    shared_assets:
      - hook-library
      - ad-copy-style-guide
      - objection-reframes

  brand_squad:
    handoff_to_traffic:
      - "brand voice guide → voice/"
      - "brand guidelines → templates/ads/"
      - "positioning statement → frameworks/strategy-layer"
    handoff_from_traffic:
      - "distinctive asset performance → brand/data/"
      - "brand awareness metrics → brand/data/metrics/"
    shared_assets:
      - tone-words-allowed
      - brand-descriptors
      - visual-guidelines

  content_squad:
    handoff_to_traffic:
      - "Blog content for promotion → tasks/strategy/"
      - "Lead magnets for funnel → templates/landing-pages/"
      - "Content calendar → tasks/strategy/seasonal-calendar-planning"
    handoff_from_traffic:
      - "Top-performing content topics from ad data → content/data/"
      - "Audience engagement signals → content/reference/"
      - "Traffic volume and conversion data per content piece → content/data/metrics/"
    shared_assets:
      - content-calendar
      - topic-performance-data
      - audience-intent-signals

  sales_squad:
    handoff_to_traffic:
      - "Lead quality feedback (MQL→SQL rates) → data/metrics/"
      - "Close rate data by source → data/metrics/"
      - "CRM pipeline data → data/registries/"
    handoff_from_traffic:
      - "Lead volume and cost per lead by channel → sales/data/"
      - "Attribution data linking ad click to sale → sales/data/"
      - "Audience segment performance → sales/reference/"
    shared_assets:
      - lead-scoring-model
      - utm-to-crm-mapping
      - offline-conversion-data
    sync_cadence: "Bi-weekly lead quality review"

  analytics_squad:
    handoff_to_traffic:
      - "Attribution model outputs → data/metrics/"
      - "Cohort analysis and LTV curves → data/research/"
      - "Custom dashboards → data/metrics/kpi-dashboard-spec"
    handoff_from_traffic:
      - "Raw campaign data exports → analytics/data/"
      - "Experiment results for meta-analysis → analytics/data/"
      - "Tracking implementation specs → analytics/reference/"
    shared_assets:
      - attribution-methodology
      - data-dictionary
      - metric-definitions
    sync_cadence: "Weekly data quality check"

  product_squad:
    handoff_to_traffic:
      - "Product launch dates and messaging → tasks/strategy/"
      - "Feature updates for ad angle mining → data/research/"
      - "Pricing changes → frameworks/offer-and-proof-stack"
    handoff_from_traffic:
      - "Market demand signals from ad performance → product/data/"
      - "Customer objection patterns → product/reference/"
      - "Competitive positioning data → product/data/"
    shared_assets:
      - launch-calendar
      - pricing-matrix
      - feature-benefit-mapping
    sync_cadence: "Monthly product-traffic alignment"

