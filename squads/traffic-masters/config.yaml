# ============================================================
# CROSS-SQUAD INTEGRATION
# ============================================================

cross_squad:
  copy_squad:
    handoff_to_traffic:
      - "ad copy (headlines, primary text, CTAs) → templates/ads/"
      - "VSL scripts → templates/ads/youtube-ad-script-aducate"
      - "landing page copy → tasks/setup/"
    handoff_from_traffic:
      - "creative performance data → copy/data/"
      - "audience insights → copy/reference/"
      - "winning hooks → copy/swipe/"
    shared_assets:
      - hook-library
      - ad-copy-style-guide
      - objection-reframes

  brand_squad:
    handoff_to_traffic:
      - "brand voice guide → voice/"
      - "brand guidelines → templates/ads/"
      - "positioning statement → frameworks/strategy-layer"
    handoff_from_traffic:
      - "distinctive asset performance → brand/data/"
      - "brand awareness metrics → brand/data/metrics/"
    shared_assets:
      - tone-words-allowed
      - brand-descriptors
      - visual-guidelines

# ============================================================
# QUALITY GATES
# ============================================================

quality_gates:
  mandatory:
    - campaign-build-quality
    - tracking-plan-quality
    - reporting-quality
  per_domain:
    meta: [meta/meta-account-structure-quality, meta/meta-capi-quality]
    google: [google/google-search-build-quality, google/google-bidding-quality]
    youtube: [youtube/yt-campaign-setup-quality, youtube/yt-creative-hook-5s]
    creative: [creative-brief-quality, creative/angle-coverage-quality]
    finance: [financial-reconciliation-quality, finance/budget-approval]

# ============================================================
# KPIs
# ============================================================

kpis:
  acquisition:
    - cac
    - ncac
    - cpl
    - cpa
  efficiency:
    - roas
    - mer
    - ltv_to_cac
    - payback_period
  engagement:
    - ctr
    - cvr
    - hook_rate
    - thumb_stop_ratio
  creative:
    - creative_win_rate
    - creative_lifespan
    - creative_diversity_index
  operational:
    - budget_pacing_accuracy
    - test_velocity
    - platform_diversification

# ============================================================
# DEFAULTS
# ============================================================

defaults:
  review_agent: traffic-chief
  min_checklists: 1
  registry_on_completion: true
  output_format: markdown
  budget_model: "70/20/10"
  attribution_window: "7d_click_1d_view"
