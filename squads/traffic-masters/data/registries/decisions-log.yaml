# ============================================================
# DECISIONS LOG — Traffic Masters Squad
# ============================================================
# Registro operacional de decisões estratégicas e táticas.
# Toda decisão relevante (budget shifts, mudança de targeting,
# troca de métrica-chave, etc.) deve ser registrada aqui para
# accountability, aprendizado contínuo e rastreabilidade.
# ============================================================

schema:
  decision_id: "string — identificador único (DEC-XXX)"
  date: "date — data da decisão"
  decision_summary: "string — resumo curto da decisão"
  context: "string — situação/problema que motivou a decisão"
  alternatives_considered:
    - "string — opção avaliada"
  chosen_option: "string — alternativa escolhida"
  rationale: "string — justificativa da escolha"
  owner_agent: "string — agente responsável pela decisão"
  related_task: "string — task do config.yaml relacionada"
  impact_assessment: "string — impacto esperado em métricas e operação"
  review_date: "date — data prevista para revisão do resultado"
  status: "string — active | superseded | archived"
  outcome_notes: "string — resultado real observado (preenchido após review_date)"

decisions:
  - decision_id: "DEC-001"
    date: "2026-02-15"
    decision_summary: "Migrar de interest-based targeting para broad targeting no Meta"
    context: >
      CPAs de prospecção cold subiram 22% nos últimos 30 dias usando
      audiences de interesse (skincare, beleza). O algoritmo do Meta
      Advantage+ tem mostrado performance superior em contas com
      criativo forte e volume de conversões acima de 50/semana.
    alternatives_considered:
      - "Manter interest-based e testar novos interesses de nicho"
      - "Migrar para Lookalike 1-3% baseado em compradores 180d"
      - "Abrir broad targeting (18-65, sem interesses) e deixar o algoritmo otimizar"
      - "Testar Advantage+ Shopping Campaign com catálogo completo"
    chosen_option: "Abrir broad targeting (18-65, sem interesses) e deixar o algoritmo otimizar"
    rationale: >
      A conta já ultrapassou 80 conversões/semana, o que dá sinal
      suficiente para o algoritmo do Meta. Broad targeting elimina
      o ceiling de audience size e reduz sobreposição. Dados internos
      de contas similares mostram queda de 15-20% no CPA após 2 semanas
      de learning phase.
    owner_agent: "media-buyer"
    related_task: "retargeting-strategy"
    impact_assessment: >
      Esperamos redução de CPA de R$ 48 para ~R$ 38 em 14 dias.
      Risco: aumento temporário de CPA durante learning phase
      (estimado 3-5 dias). Budget diário mantido em R$ 2.800 para
      não resetar a fase de aprendizado.
    review_date: "2026-03-01"
    status: "active"
    outcome_notes: >
      CPA caiu para R$ 35,20 após 18 dias. Broad superou interest-based
      em 27%. Volume de leads qualificados aumentou 34%. Decisão validada.

  - decision_id: "DEC-002"
    date: "2026-03-03"
    decision_summary: "Adotar nCAC como métrica primária de aquisição no lugar de CPA"
    context: >
      O CPA blended não diferencia clientes novos de recompras, inflando
      artificialmente a eficiência reportada. Ralph Burns (framework nCAC)
      recomenda isolar custo de aquisição de novos clientes para decisões
      de scaling. Atualmente 38% das conversões atribuídas são de clientes
      recorrentes, distorcendo o CPA em ~R$ 12.
    alternatives_considered:
      - "Continuar usando CPA blended e monitorar % novos vs. recorrentes separadamente"
      - "Adotar nCAC (New Customer Acquisition Cost) como métrica primária"
      - "Usar MER (Marketing Efficiency Ratio) como métrica-mãe e derivar nCAC como secundária"
    chosen_option: "Adotar nCAC (New Customer Acquisition Cost) como métrica primária"
    rationale: >
      nCAC dá visibilidade real do custo de crescimento. MER é útil mas
      esconde ineficiências de aquisição quando a base de clientes gera
      receita orgânica. Com nCAC isolado, podemos definir guardrails
      precisos para scaling (ex: nCAC < 0.33x LTV 90d). Alinha com
      framework burns-ncac-method já mapeado no config.yaml.
    owner_agent: "performance-analyst"
    related_task: "measurement-plan"
    impact_assessment: >
      Dashboards e reports semanais serão atualizados para exibir nCAC
      como KPI primário. Guardrail de nCAC máximo definido em R$ 62
      (baseado em LTV 90d de R$ 186). Expectativa: decisões de budget
      mais conservadoras no curto prazo, mas CAC real 18% menor em 60 dias.
    review_date: "2026-05-03"
    status: "active"
    outcome_notes: ""
