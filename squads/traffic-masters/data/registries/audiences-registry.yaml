# Audiences Registry
# Tracks all audience definitions across platforms and campaigns.

schema:
  audience_id: "string — unique identifier"
  name: "string — descriptive audience name"
  platform: "string — meta | google | tiktok | youtube | linkedin"
  type: "string — cold | warm | hot | lookalike | custom | retargeting"
  definition: "string — targeting criteria or audience source"
  size_estimate: "number — estimated audience size"
  campaign_ids: "list — campaigns using this audience"
  performance:
    cpm: "number"
    ctr: "number"
    cpa: "number"
    roas: "number"
  status: "string — active | paused | archived"
  created_date: "date"
  last_updated: "date"
  notes: "string"

audiences: []
