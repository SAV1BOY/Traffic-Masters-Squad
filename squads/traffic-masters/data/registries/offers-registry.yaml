# Offers Registry
# Tracks all offers, lead magnets, and value propositions in use.

schema:
  offer_id: "string — unique identifier"
  name: "string — offer name"
  type: "string — lead_magnet | tripwire | core | premium | upsell | downsell"
  price: "number — price in USD (0 for free)"
  description: "string — brief offer description"
  target_avatar: "string — avatar/ICP this offer serves"
  funnel_position: "string — top | middle | bottom"
  landing_page_url: "string"
  conversion_rate: "number — percentage"
  avg_cpa: "number — average cost per acquisition"
  status: "string — active | testing | paused | retired"
  created_date: "date"
  last_updated: "date"
  notes: "string"

offers: []
