# ============================================================
# BACKLOG — ICE-Scored Task Backlog
# ============================================================
# Prioritized backlog of improvement tasks, experiments, and
# operational upgrades. Scored using ICE (Impact x Confidence x Ease).
# Reviewed and reprioritized weekly by traffic-chief.

schema:
  item_id: "string — BKL-XXX format"
  title: "string — concise task title"
  description: "string — what needs to be done and why"
  category: "string — optimization | creative | tracking | scaling | operations | research | compliance"
  impact: "number — 1-10 (how much value does this create?)"
  confidence: "number — 1-10 (how confident are we in the impact estimate?)"
  ease: "number — 1-10 (how easy is this to implement?)"
  ice_score: "number — (impact x confidence x ease) / 10"
  requested_by: "string — agent slug or stakeholder"
  assigned_to: "string — agent slug or 'unassigned'"
  status: "string — backlog | prioritized | in-progress | done | blocked | deferred"
  deadline: "date — target completion date (if applicable)"
  related_task: "string — config.yaml routing key (if applicable)"
  notes: "string — additional context"

